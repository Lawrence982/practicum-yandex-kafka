version: "3.5"
services:

  app:
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:62924
    ports:
      - "8081:8080"
      - "62924:62924"
    networks:
      - proxynet
networks:
  proxynet:
    name: custom_network