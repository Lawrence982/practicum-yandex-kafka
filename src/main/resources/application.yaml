spring:
  application:
    name: yandex-kafka
  kafka:
    bootstrap-servers: rc1d-akfhce988i4f36hi.mdb.yandexcloud.net:9091, rc1d-i9dbkctktl0sd1p2.mdb.yandexcloud.net:9091, rc1d-r746t9u49m7la3ah.mdb.yandexcloud.net:9091
    ssl:
      trust-store-location: file:/opt/yandex-kafka/security/ssl
      trust-store-password: kafka-pass
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka-user" password="kafka-pass";
      schema.registry.url: https://rc1d-akfhce988i4f36hi.mdb.yandexcloud.net:443
      schema.registry.ssl.truststore.location: /opt/yandex-kafka/security/ssl
      schema.registry.ssl.truststore.password: kafka-pass
      schema.registry.basic.auth.user.info: kafka-user:kafka-pass
      schema.registry.basic.auth.credentials.source: USER_INFO
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      group-id: kafka-cloud-message
      properties:
        spring.json.trusted.packages: "ru.yandex.practicum.dto.*"
        spring.json.value.default.type: "ru.yandex.practicum.dto.Notification"
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.json.KafkaJsonSchemaSerializer

topic:
  name: topic-unit-6