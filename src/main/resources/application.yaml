spring:
  application:
    name: yandex-kafka
  kafka:
    bootstrap-servers: kafka-0:9093, kafka-1:9095
    ssl.trust-store-location: file:/opt/yandex-kafka/kafka-0-creds/kafka.truststore.jks
    ssl.trust-store-password: kafka-pass
    ssl.key-store-location: file:/opt/yandex-kafka/kafka-0-creds/kafka.keystore.jks
    ssl.key-store-password: kafka-pass
    ssl.key-password: kafka-pass
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="kafka-pass";
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      group-id: kafka-security-message
      properties:
        spring.json.trusted.packages: "ru.yandex.practicum.dto.*"
        spring.json.value.default.type: "ru.yandex.practicum.dto.Notification"
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      asks: all # количество реплик, которые должны подтвердить синхронизацию
      retries: 3 # сколько раз клиент попытается повторно отправить сообщение после возникновения ошибки
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


topic:
  notifications:
    name: test-notifications
    partitions: 3
    replicas: 2
    min-insync-replicas: 2