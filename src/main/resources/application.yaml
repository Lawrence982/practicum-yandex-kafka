spring:
  application:
    name: yandex-kafka
  kafka:
    bootstrap-servers: kafka-0:9094, kafka-1:9095, kafka-2:9096
    producer:
      asks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      properties:
        spring.json.trusted.packages: "ru.yandex.practicum.*"

product:
  topic:
    name: create-product-topic
    partitions: 3
    replicas: 2
    min-insync-replicas: 2